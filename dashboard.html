<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Point5 Command Center</title>
<style>html,body{height:100%;margin:0;background:#071422;color:#8aa3b5;font:14px system-ui}#boot{padding:28px}</style>
</head>
<body>
<div id="boot">Loading Point5 Command Center...</div>
<script>
(async function () {
  const boot = document.getElementById('boot');
  try {
    const url = 'https://raw.githubusercontent.com/tonycodes/point5-command-center/main/app.html?ts=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('Dashboard request failed (' + res.status + ')');
    const html = await res.text();
    if (!html || !/<html[\s>]/i.test(html)) throw new Error('Invalid dashboard response');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    boot.textContent = 'Could not load latest dashboard: ' + e;
  }
})();
</script>
</body>
</html>
