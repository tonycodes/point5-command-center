<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Point5 Command Center</title>
<style>html,body{height:100%;margin:0;background:#071422;color:#8aa3b5;font:14px system-ui}#boot{padding:28px}</style>
</head>
<body>
<div id="boot">Loading Point5 Command Center…</div>
<script>
(async function () {
  const boot = document.getElementById('boot');
  try {
    const url = 'https://api.github.com/repos/tonycodes/point5-command-center/contents/app.html?ref=main&ts=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    const text = await res.text();
    let html = text;
    if (text.trim().charAt(0) === '{') {
      const j = JSON.parse(text);
      html = atob(String(j.content || '').replace(/\n/g, ''));
    }
    if (!html || html.indexOf('<html') === -1) throw new Error('empty payload');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    boot.textContent = 'Could not load latest dashboard: ' + e;
  }
})();
</script>
</body>
</html>
