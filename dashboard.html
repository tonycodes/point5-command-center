<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Point5 Command Center</title>
<style>html,body{height:100%;margin:0;background:#071422;color:#8aa3b5;font:14px IBM Plex Sans,system-ui,sans-serif}#boot{padding:28px}</style>
</head>
<body>
<div id="boot">Loading Point5 Command Center…</div>
<script>
(async function () {
  const sources = [
    'https://raw.githubusercontent.com/tonycodes/point5-command-center/main/app.html?ts=' + Date.now(),
    'https://cdn.jsdelivr.net/gh/tonycodes/point5-command-center@main/app.html?ts=' + Date.now()
  ];
  let html = null, err;
  for (const url of sources) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      html = await res.text();
      if (html && html.indexOf('<html') !== -1) break;
    } catch (e) { err = e; }
  }
  if (!html) {
    document.getElementById('boot').textContent = 'Could not load latest dashboard. ' + (err || '');
    return;
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
